    <meta name="author" content="Trisha Raye Cararag" />

    <meta name="theme-color" content="#151118" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8F4F2" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/portfolioicon.png" />
    <link rel="apple-touch-icon" href="/portfolioicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Set the theme before first paint: no light/dark flash -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
